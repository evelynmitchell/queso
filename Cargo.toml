[workspace]
resolver = "2"
members = ["crates/sim", "crates/consensus", "crates/smr", "crates/net", "crates/compare", "crates/conformance", "crates/chain"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Queso contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
