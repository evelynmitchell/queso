\* TLC configuration for QuePaxaConcrete.tla -- the paper's Appendix D
\* baseline: 2 proposers, 3 recorders, two full rounds (steps 4..11),
\* 1-bit random priorities, 2 values. See spec/README.md for the
\* soundness discussion of each bound and reduction.
CONSTANTS
    NP      = 2
    Recorders = {r1, r2, r3}
    NV      = 2
    PriMax  = 2
    MaxStep = 11
    None    = None

SYMMETRY RecSym

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Agreement
    Validity
    RepliesAhead
    DecisionAtPhase2
    DecisionDominance
    IsrConsistent
    ValuesFromInputs

PROPERTIES
    DecideOnce
    Monotone
