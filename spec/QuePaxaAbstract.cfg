\* TLC configuration for QuePaxaAbstract.tla
\* N = 3 replicas, a 2-value domain, all 3! priority rankings and all 2^3
\* input assignments explored from Init, MaxRound = 2 (sufficient -- see
\* README.md, "Why MaxRound = 2 suffices").  Exhaustive model check; the
\* completed TLC output is pasted in README.md.

SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    r3 = r3
    Replicas = {r1, r2, r3}

    v1 = v1
    v2 = v2
    Values = {v1, v2}

    MaxRound = 2

    None = None

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
INVARIANT DecisionUnanimity

PROPERTY DecideOnce

\* The only quiescent state is the intentional Done self-loop once
\* round > MaxRound; disable the deadlock check so TLC does not flag it.
CHECK_DEADLOCK FALSE
