name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Rustdoc warnings gated like clippy's (issue #79): broken intra-doc
      # links are doc rot pointing at moved/renamed items, and the module
      # docs here carry design reasoning, not just API notes.
      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: cargo build
        run: cargo build --all

      - name: cargo test
        run: cargo test --all

  # The abstract TLA+ model, checked rather than pasted (issue #78). ~20s
  # of TLC, so it fits the commit gate; the concrete model (~15 min) runs
  # on a schedule in tlc-nightly.yml -- same per-PR/nightly split, and the
  # same jar-vendoring and exact-count rationale documented there.
  #
  # The exact-count assertion is the load-bearing half: a model or config
  # edit that silently shrank the state space would still pass every
  # invariant, and its green would mean nothing. "Generated" as well as
  # "distinct" is pinned -- measured identical across 2 and 4 workers and
  # two TLC builds (2.19 and 2026.08.21); see spec/README.md.
  tlc-abstract:
    name: "TLC: abstract model"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED: "3681792 states generated, 106704 distinct states found, 0 states left on queue"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Model-check QuePaxaAbstract
        run: |
          java -XX:+UseParallelGC -cp spec/tla2tools.jar tlc2.TLC \
            -workers 4 -config spec/QuePaxaAbstract.cfg spec/QuePaxaAbstract.tla \
            2>&1 | tee tlc-abstract.log

      - name: Assert the run is complete, correct, and the recorded size
        run: |
          grep -q "Model checking completed. No error has been found." tlc-abstract.log || {
            echo "::error::TLC found an error or did not complete -- see the log above for the trace."
            exit 1
          }
          grep -qF "$EXPECTED" tlc-abstract.log || {
            echo "::error::TLC completed clean but the state space is not the recorded one."
            echo "Expected: $EXPECTED"
            echo "Got:      $(grep -E 'states generated, .* distinct states found' tlc-abstract.log | tail -1)"
            echo "If the model/config changed deliberately, update this job's EXPECTED"
            echo "and the pasted output in spec/README.md together. If not, this is a finding."
            exit 1
          }

  # The real-process suite gets a job of its own rather than a place in
  # `cargo test --all`. Every scenario boots real `queso-node` processes and
  # spends most of its wall clock asleep waiting for real timers, so folding
  # it into the commit gate would roughly double that job's runtime to
  # exercise a different layer -- and a failure here (a real socket, a real
  # SIGKILL) wants to be legible as such rather than buried among unit
  # tests.
  #
  # `--ignored` is how those tests are marked; see `crates/soak`'s README
  # for why, and for the long-soak mode this bounded variant is the CI
  # sibling of.
  soak:
    name: real-process suite (phases 9.2-9.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      # `queso-soak` spawns the `queso-node` binary, which its own test
      # profile does not build: the crate depends on `queso-net`'s library,
      # not its binary. Without this the tests panic with that instruction.
      - name: cargo build
        run: cargo build --all

      # `--nocapture` so the schedule and the report land in the log even on
      # a pass. Two reasons: a failure's first question is "which schedule",
      # and a pass still needs its margin visible -- the anti-vacuity floors
      # are only trustworthy if someone can see how far above them this
      # runner actually lands.
      - name: real-process scenarios and the bounded soak
        run: cargo test -p queso-soak -- --ignored --skip a_long_soak_over_many_seeds --nocapture

      # A failing soak must not destroy its own evidence. The one divergence
      # this job has ever reported (issue #92, on a post-#88 build) left
      # nothing to adjudicate: the tests ran their cluster in a tempdir the
      # panic unwind deleted, and this job -- unlike nightly-soak.yml -- kept
      # no artifact. The tests now preserve a failing seed's cluster state
      # under `crates/soak/soak-failures/` and adjudicate it in the log
      # (see `sustained_soak.rs`); this step carries the state out, so the
      # verdict can be re-checked against a build of your choosing:
      #
      #   cargo run -p queso-soak --bin queso-postmortem -- <dir>/seed-<n>
      - name: Upload preserved cluster state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-soak-evidence-run${{ github.run_id }}
          path: crates/soak/soak-failures/
          retention-days: 30
          # The antithesis step below can also fail this job, without
          # producing preserved state -- that is not worth a second failure.
          if-no-files-found: ignore

      # Phase 9.3 (#54): the Antithesis test template, exercised without
      # Antithesis. Boots a real cluster, runs each Test Composer command as
      # its own process, and checks every property was reached and
      # evaluated -- the verifiable half of a deliverable whose other half
      # needs an account. Lives in this job because it spawns real node
      # processes, same as everything else here.
      - name: antithesis test template (local)
        run: cargo test -p queso-antithesis -- --ignored --test-threads=1 --nocapture
