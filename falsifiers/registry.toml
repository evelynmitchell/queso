[[mutation]]
id = "d10-drop-decisions"
property = "D10"
issue = 129
note = "The decision counter never increments. The broadest of the #129 mutations: it takes out the denominator every other counter is read against. `expect_pass` is deliberately empty -- all three tests in the file read `decisions`, so this file has no control for it. The control for 'does any #129 mutation simply redden everything' is the other four entries here, each of which leaves named tests passing."
file = "crates/smr/src/replica.rs"
find = "        st.metrics.decisions += 1;"
replace = "        // MUTANT: st.metrics.decisions += 1;"
scope = ["-p", "queso-smr", "--test", "observability_metrics"]
expect_fail = ["an_uncontended_cluster_decides_on_the_fast_path", "decisions_counts_slots_this_replica_decided", "a_restart_clears_the_counters"]
expect_pass = []

