# Registered falsifier mutations -- see replay.py for what this is and why.
#
# Each entry is a mutation that some `Falsifier, run:` marker in `crates/`
# describes in prose. Prose is not machine-applicable (§6.4 records that 3
# of 20 re-runs needed their mutation reconstructed first), so the exact
# edit lives here instead, and `replay.py` applies it verbatim.
#
# `expect_fail` is what must still die. `expect_pass` are controls: without
# them a mutation that reddens everything would read as a precise
# instrument. An empty `expect_fail` is a recorded **zero** -- the claim is
# that nothing named detects this, and a new kill is a finding to write up.

[[mutation]]
id = "p8a-dedup-off"
property = "P8a"
issue = 125
note = "Dedup disabled entirely: every retry re-applies."
file = "crates/smr/src/kv.rs"
find = "let is_duplicate = self.last_seq.get(client).is_some_and(|&s| s >= *seq);"
replace = "let is_duplicate = false;"
scope = ["-p", "queso-smr", "--test", "idempotency"]
expect_fail = ["a_late_duplicate_does_not_clobber_a_later_write", "a_reordered_lower_seq_does_not_undo_a_higher_seq_already_applied", "an_exact_retry_of_the_latest_command_does_not_reapply"]
expect_pass = ["duplicate_reads_agree_and_are_linearizable"]

[[mutation]]
id = "p8a-gte-to-gt"
property = "P8a"
issue = 125
note = "Off-by-one exempting a client's retry of its own latest command."
file = "crates/smr/src/kv.rs"
find = ".is_some_and(|&s| s >= *seq)"
replace = ".is_some_and(|&s| s > *seq)"
scope = ["-p", "queso-smr", "--test", "idempotency"]
expect_fail = ["an_exact_retry_of_the_latest_command_does_not_reapply"]
expect_pass = ["a_late_duplicate_does_not_clobber_a_later_write", "a_reordered_lower_seq_does_not_undo_a_higher_seq_already_applied", "duplicate_reads_agree_and_are_linearizable"]

[[mutation]]
id = "p8-checker-vacuous"
property = "P8"
issue = 125
note = "The instrument itself: a checker that accepts every history."
file = "crates/smr/src/linearizability.rs"
find = "pub fn is_linearizable(history: &[HistoryOp]) -> bool {\n    let n = history.len();"
replace = "pub fn is_linearizable(history: &[HistoryOp]) -> bool {\n    return true;\n    #[allow(unreachable_code)]\n    let n = history.len();"
scope = ["-p", "queso-smr", "--test", "linearizability"]
expect_fail = ["a_stale_local_read_is_rejected_by_the_checker", "a_causally_ordered_submission_never_ties_a_prior_completion"]
expect_pass = ["randomized_concurrent_workload_is_linearizable_n3", "randomized_concurrent_workload_is_linearizable_n5", "genuinely_concurrent_submissions_stay_untied_and_the_history_is_still_accepted"]

[[mutation]]
id = "p8-catchup-skips-apply"
property = "P8"
issue = 125
note = "RECORDED ZERO. A catch-up probe learns the slot into the log but never applies it. A genuine P8 violation that linearizability.rs cannot see, because its workload never crashes a replica."
file = "crates/smr/src/replica.rs"
find = "let applied = st.durable.kv.apply(&decided);"
replace = "let applied = if matches!(attempt.origin, AttemptOrigin::CatchUp) {\n            match &decided {\n                Command::Get { key, .. } => crate::kv::Applied::Get(st.durable.kv.get(*key)),\n                Command::Put { .. } => crate::kv::Applied::PutNew,\n            }\n        } else {\n            st.durable.kv.apply(&decided)\n        };"
scope = ["-p", "queso-smr", "--test", "linearizability"]
expect_fail = []
expect_pass = ["randomized_concurrent_workload_is_linearizable_n3", "randomized_concurrent_workload_is_linearizable_n5", "a_stale_local_read_is_rejected_by_the_checker", "a_causally_ordered_submission_never_ties_a_prior_completion", "genuinely_concurrent_submissions_stay_untied_and_the_history_is_still_accepted"]

