[[mutation]]
id = "p15-hedge-defers-on-stale-progress"
property = "P15/P16"
issue = 125
note = "Hedge gate defers whenever the recorders are ahead, not only when they advanced: a backup parks forever behind a step a dead leader left behind."
file = "crates/consensus/src/proposer.rs"
find = "            Some(step) if step > self.step && Some(step) != self.last_seen_progress"
replace = "            Some(step) if step > self.step"
