[[mutation]]
id = "p15-hedge-defers-on-stale-progress"
property = "P15/P16"
issue = 125
note = "Hedge gate defers whenever the recorders are ahead, not only when they advanced: a backup parks forever behind a step a dead leader left behind."
file = "crates/consensus/src/proposer.rs"
find = "            Some(step) if step > self.step && Some(step) != self.last_seen_progress"
replace = "            Some(step) if step > self.step"
scope = ["-p", "queso-consensus", "--test", "hedging"]
expect_fail = ["p15_per_proposer_misconfigured_schedule_still_decides", "p15_huge_delta_still_decides_when_the_leader_never_delivers", "p16_leader_failure_recovery_is_gated_by_delta_but_never_lost", "safety_holds_under_hedging_with_adversary_and_crashes"]
expect_pass = ["p15_delta_sweep_always_makes_progress_and_redundant_effort_shrinks", "p15_huge_delta_eventually_converges_and_never_permanently_stalls"]

