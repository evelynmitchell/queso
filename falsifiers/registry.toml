find = "        st.metrics = NodeMetrics::default();"
replace = "        // MUTANT: st.metrics = NodeMetrics::default();"
scope = ["-p", "queso-smr", "--test", "observability_metrics"]
expect_fail = ["a_restart_clears_the_counters"]
expect_pass = ["an_uncontended_cluster_decides_on_the_fast_path", "decisions_counts_slots_this_replica_decided"]

[[mutation]]
id = "d10-decisions-from-frontier"
property = "D10"
issue = 129
note = "`decisions` derived from the durable frontier instead of counted. Registered because it is the mutation that measured the one-accessor change: while SmrCluster::metrics and SmrNode::metrics were independent one-line reads, mutating the node's accessor survived every test. It separates from a real count only across a restart, so the restart test is the only one that can kill it -- and the other two passing is the point, not a weakness."
file = "crates/smr/src/replica.rs"
find = "    pub(crate) fn observability(&self) -> NodeMetrics {\n        self.metrics\n    }"
replace = "    pub(crate) fn observability(&self) -> NodeMetrics {\n        NodeMetrics { decisions: self.durable.next_slot, ..self.metrics }\n    }"
scope = ["-p", "queso-smr", "--test", "observability_metrics"]
expect_fail = ["a_restart_clears_the_counters"]
expect_pass = ["an_uncontended_cluster_decides_on_the_fast_path", "decisions_counts_slots_this_replica_decided"]

