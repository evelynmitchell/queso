[package]
name = "queso-consensus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Phase 1: abstract single-slot QuePaxa consensus (Algorithm 1) atop the queso-sim harness."

[lints]
workspace = true

[dependencies]
queso-sim = { path = "../sim" }
rand = "0.8"
serde = { workspace = true, optional = true }

[features]
# See queso-sim's "serde" feature docs; forwarded so queso-net can enable
# wire (de)serialization for this crate's message types too.
serde = ["dep:serde", "queso-sim/serde"]

[dev-dependencies]
