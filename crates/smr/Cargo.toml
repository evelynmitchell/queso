[package]
name = "queso-smr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Phase 4: a multi-slot replicated log (SMR) driving a linearizable in-memory KV store, atop queso-consensus's concrete per-slot protocol, with crash-recovery restart safety (P9/P12)."

[lints]
workspace = true

[dependencies]
queso-consensus = { path = "../consensus" }
queso-sim = { path = "../sim" }
rand = "0.8"
serde = { workspace = true, optional = true }

[features]
# See queso-sim's "serde" feature docs; forwarded so queso-net can enable
# wire (de)serialization for this crate's Command type too.
serde = ["dep:serde", "queso-consensus/serde", "queso-sim/serde"]

[dev-dependencies]
