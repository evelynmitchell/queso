[package]
name = "queso-chain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Chain-of-Blocks (n, h) hash chain over an applied command sequence, shared by the node (queso-net's /chain checkpoints) and the conformance harness so both compute byte-identical hashes."

# Pure, allocation-light, no I/O: this crate opts into the workspace
# determinism lints like the sim-verified core does. It is depended on by
# `queso-net` (which does not), so nothing here may reach for wall-clock
# time, threads, or ambient randomness.
[lints]
workspace = true

[dependencies]
queso-smr = { path = "../smr" }
