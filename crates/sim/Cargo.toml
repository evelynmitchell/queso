[package]
name = "queso-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deterministic discrete-event simulation kernel for Queso (Phase 0: no consensus logic)."

[lints]
workspace = true

[dependencies]
rand = "0.8"
serde = { workspace = true, optional = true }

[features]
# Wire (de)serialization support for the id/payload types, consumed by
# queso-net's real-network transport. Off by default: the sim/consensus/smr
# core has no business depending on serde.
serde = ["dep:serde"]

[dev-dependencies]
