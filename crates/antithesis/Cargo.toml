[package]
name = "queso-antithesis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Phase 9.3: the Chain-of-Blocks workload packaged as an Antithesis test template -- a container that drives real queso-node containers and expresses Queso's safety and liveness properties as Antithesis assertions."

# Real-I/O boundary code, like `queso-net`, `queso-compare` and
# `queso-soak`: real sockets, real wall-clock time and a real network are
# exactly this crate's job, so it does NOT opt into `[workspace.lints]`.
# Those determinism lints are a property of the sim-verified core and of
# `queso-conformance`'s in-process harness; enforcing them here would be
# meaningless.

[dependencies]
queso-chain = { path = "../chain" }
queso-conformance = { path = "../conformance" }
queso-net = { path = "../net" }
queso-sim = { path = "../sim" }
queso-smr = { path = "../smr" }
antithesis_sdk = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }

[dev-dependencies]
tempfile = "3"
