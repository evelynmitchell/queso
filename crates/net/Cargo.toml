[package]
name = "queso-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Phase 7.1: a real-TCP transport and node binary driving the sim-verified queso-consensus/queso-smr core unchanged, over tokio."

# This crate is the deliberate real-I/O boundary (see the crate docs):
# real sockets, real wall-clock time, real OS entropy. It does NOT opt into
# `[workspace.lints]` -- the workspace's determinism lints (no real time, no
# ambient randomness, no HashMap) are a property of the sim-verified core
# (queso-sim/queso-consensus/queso-smr) only, and are deliberately not
# enforced here.

[dependencies]
queso-consensus = { path = "../consensus", features = ["serde"] }
queso-sim = { path = "../sim", features = ["serde"] }
queso-smr = { path = "../smr", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
serde = { workspace = true }
bincode = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
